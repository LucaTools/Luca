name: Run tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests-macos:
    name: Run tests (macOS)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history and tags

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Delete build artifacts
        run: swift package clean

      - name: Run package tests
        run: swift test

  run-tests-linux:
    name: Run tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete build artifacts
        run: swift package clean

      - name: Run package tests
        run: swift test
