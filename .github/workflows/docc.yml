name: DocC

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Select Xcode
        uses: LucaTools/select-xcode@v1

      - name: Build DocC
        run: |
          # Build each target into its own directory to avoid the second run
          # clearing the first run's output (swift-docc-plugin clears the
          # output directory before each generation).
          swift package --allow-writing-to-directory ./docs-lucacore \
            generate-documentation --target LucaCore \
            --disable-indexing \
            --output-path ./docs-lucacore \
            --transform-for-static-hosting \
            --hosting-base-path Luca

          swift package --allow-writing-to-directory ./docs \
            generate-documentation --target LucaCLI \
            --disable-indexing \
            --output-path ./docs \
            --transform-for-static-hosting \
            --hosting-base-path Luca

          # Merge LucaCore's target-specific subdirectories into the LucaCLI
          # output. Each target occupies its own path so there is no conflict.
          cp -r ./docs-lucacore/documentation/lucacore ./docs/documentation/
          cp -r ./docs-lucacore/data/documentation/lucacore ./docs/data/documentation/

          # Redirect root to CLI documentation (primary user-facing entry point)
          echo '<script>window.location.href += "/documentation/lucacli"</script>' > docs/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
