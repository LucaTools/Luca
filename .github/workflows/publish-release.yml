name: Publish release

on:
  push:
    tags:
      - '*'

env:
  PRODUCT_NAME: luca
  TOOL_NAME: Luca

jobs:
  build-macos:
    name: Build macOS universal binary
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history and tags
        
      - name: Select Xcode
        uses: LucaTools/select-xcode@v1

      - name: Delete build artifacts
        shell: bash
        run: swift package clean

      - name: Update version in Version.swift
        run: |
          if [ -f "Sources/LucaCLI/Version.swift" ]; then
            sed -i '' 's/let version = "[^"]*"/let version = "${{ github.ref_name }}"/' Sources/LucaCLI/Version.swift
          else
            echo "No Sources/LucaCLI/Version.swift file found."
            exit 1
          fi

      - name: Build binary (arm64)
        shell: bash
        run: swift build -c release --arch arm64

      - name: Build binary (x86_64)
        shell: bash
        run: swift build -c release --arch x86_64

      - name: Create macOS universal binary
        id: create-macos-universal-binary
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR=".github/.build"
          mkdir -p "$OUT_DIR"
          UNIVERSAL_BIN="$OUT_DIR/${{ env.PRODUCT_NAME }}"
          lipo -create \
            -output "$UNIVERSAL_BIN" \
            .build/arm64-apple-macosx/release/${{ env.PRODUCT_NAME }} \
            .build/x86_64-apple-macosx/release/${{ env.PRODUCT_NAME }}
          chmod +x "$UNIVERSAL_BIN"
          echo "binary-folder=$OUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Zip binary
        working-directory: .github/.build/
        run: zip -r ${{ env.TOOL_NAME }}-macOS.zip ${{ env.PRODUCT_NAME }}

      - name: Upload macOS universal binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-universal-binary
          path: ${{ steps.create-macos-universal-binary.outputs.binary-folder }}/${{ env.TOOL_NAME }}-macOS.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux x86_64 binary
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    timeout-minutes: 15
    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y curl zip

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update version in Version.swift
        run: |
          if [ -f "Sources/LucaCLI/Version.swift" ]; then
            sed -i 's/let version = "[^"]*"/let version = "${{ github.ref_name }}"/' Sources/LucaCLI/Version.swift
          else
            echo "No Sources/LucaCLI/Version.swift file found."
            exit 1
          fi

      - name: Delete build artifacts
        run: swift package clean

      - name: Build binary (x86_64)
        run: swift build --product ${{ env.PRODUCT_NAME }} -c release -Xswiftc -static-stdlib

      - name: Zip binary
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR=".github/.build"
          mkdir -p "$OUT_DIR"
          cp .build/release/${{ env.PRODUCT_NAME }} "$OUT_DIR/${{ env.PRODUCT_NAME }}"
          chmod +x "$OUT_DIR/${{ env.PRODUCT_NAME }}"
          cd "$OUT_DIR"
          zip -r ${{ env.TOOL_NAME }}-Linux.zip ${{ env.PRODUCT_NAME }}

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-binary
          path: .github/.build/${{ env.TOOL_NAME }}-Linux.zip
          if-no-files-found: error

  generate-artifactbundle:
    name: Generate artifactbundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ build-macos, build-linux ]
    steps:
      - name: Download macOS universal binary artifact
        uses: actions/download-artifact@v4
        with:
          name: macOS-universal-binary
          path: artifacts/macos

      - name: Download Linux binary artifact
        uses: actions/download-artifact@v4
        with:
          name: Linux-binary
          path: artifacts/linux

      - name: Extract binaries
        run: |
          set -euo pipefail
          mkdir -p extracted/macos extracted/linux
          unzip artifacts/macos/${{ env.TOOL_NAME }}-macOS.zip -d extracted/macos
          unzip artifacts/linux/${{ env.TOOL_NAME }}-Linux.zip -d extracted/linux

      - name: Create artifactbundle
        run: |
          set -euo pipefail
          BUNDLE="${{ env.TOOL_NAME }}.artifactbundle"
          mkdir -p "$BUNDLE/macos" "$BUNDLE/linux"
          cp extracted/macos/${{ env.PRODUCT_NAME }} "$BUNDLE/macos/${{ env.PRODUCT_NAME }}"
          cp extracted/linux/${{ env.PRODUCT_NAME }} "$BUNDLE/linux/${{ env.PRODUCT_NAME }}"
          chmod +x "$BUNDLE/macos/${{ env.PRODUCT_NAME }}" "$BUNDLE/linux/${{ env.PRODUCT_NAME }}"
          cat > "$BUNDLE/info.json" << 'EOF'
          {
            "schemaVersion": "1.0",
            "artifacts": {
              "${{ env.TOOL_NAME }}": {
                "version": "${{ github.ref_name }}",
                "type": "executable",
                "variants": [
                  {
                    "path": "macos/${{ env.PRODUCT_NAME }}",
                    "supportedTriples": ["x86_64-apple-macosx", "arm64-apple-macosx"]
                  },
                  {
                    "path": "linux/${{ env.PRODUCT_NAME }}",
                    "supportedTriples": ["x86_64-unknown-linux-gnu"]
                  }
                ]
              }
            }
          }
          EOF
          zip -r "${{ env.TOOL_NAME }}.artifactbundle.zip" "$BUNDLE"

      - name: Upload artifactbundle
        uses: actions/upload-artifact@v4
        with:
          name: artifactbundle
          path: ${{ env.TOOL_NAME }}.artifactbundle.zip
          if-no-files-found: error

  create-release:
    name: Create release w/ artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ generate-artifactbundle ]
    permissions:
      contents: write # Needed for release creation & asset upload
    steps:
      - name: Download macOS universal binary artifact
        uses: actions/download-artifact@v4
        with:
          name: macOS-universal-binary
          path: artifacts

      - name: Download Linux binary artifact
        uses: actions/download-artifact@v4
        with:
          name: Linux-binary
          path: artifacts

      - name: Download artifactbundle
        uses: actions/download-artifact@v4
        with:
          name: artifactbundle
          path: artifacts

      - name: Create GitHub Release (if not exists)
        id: create-release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/${{ github.repository }}/releases"
          EXISTING_ID=$(curl -sSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/tags/${TAG_NAME}" | jq -r '.id // empty')
          if [ -n "$EXISTING_ID" ]; then
            echo "Release already exists with id $EXISTING_ID"
            echo "release_id=$EXISTING_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RELEASE_ID=$(curl -sSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL" \
            -d '{"tag_name":"'"${TAG_NAME}"'","generate_release_notes":true}' | jq -r '.id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Failed to create release" >&2
            exit 1
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload macOS universal binary release asset
        env:
          RELEASE_ID: ${{ steps.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          FILE="artifacts/${{ env.TOOL_NAME }}-macOS.zip"
          if [ ! -f "$FILE" ]; then
            echo "Asset file not found: $FILE" >&2
            ls -R .
            exit 1
          fi
          curl -sSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.create-release.outputs.release_id }}/assets?name=${{ env.TOOL_NAME }}-macOS.zip" \
              --data-binary @"$FILE"

      - name: Upload Linux binary release asset
        env:
          RELEASE_ID: ${{ steps.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          FILE="artifacts/${{ env.TOOL_NAME }}-Linux.zip"
          if [ ! -f "$FILE" ]; then
            echo "Asset file not found: $FILE" >&2
            ls -R .
            exit 1
          fi
          curl -sSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.create-release.outputs.release_id }}/assets?name=${{ env.TOOL_NAME }}-Linux.zip" \
              --data-binary @"$FILE"

      - name: Upload artifactbundle release asset
        env:
          RELEASE_ID: ${{ steps.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          FILE="artifacts/${{ env.TOOL_NAME }}.artifactbundle.zip"
          if [ ! -f "$FILE" ]; then
            echo "Asset file not found: $FILE" >&2
            ls -R .
            exit 1
          fi
          curl -sSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.create-release.outputs.release_id }}/assets?name=${{ env.TOOL_NAME }}.artifactbundle.zip" \
              --data-binary @"$FILE"
